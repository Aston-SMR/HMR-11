<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HMR Card Counting</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HMR">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#050505;
  --gold:#f5d06f;
  --gold2:#c89b3c;
  --line:#3a2c12;
  --text:#f7e7b3;
  --muted:#bba676;
  --blue:#60a5fa;
  --red:#f87171;
  --green:#34d399;
  --orange:#fb923c;
  --purple:#a78bfa;
  --gray:#94a3b8;
  --panel:#101010;
  --panel2:#171717;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:radial-gradient(circle at top,#15110a 0%,#080808 35%,#000 100%);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
body{color:var(--text)}

.app{
  max-width:920px;
  margin:0 auto;
  padding:8px;
  display:grid;
  gap:8px;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px 12px;
  background:linear-gradient(180deg,#1a1408 0%, #0d0d0d 100%);
}
.logo-mark{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#111;
  background:linear-gradient(135deg,#fff2c2 0%,#f5d06f 45%,#b8872e 100%);
}
.logo-title{
  color:#fff4cf;
  font-size:18px;
  font-weight:900;
}
.logo-sub{
  color:#bfa56b;
  font-size:10px;
  letter-spacing:2px;
}

.top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.side{
  background:#111;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px 8px;
}
.side-title{
  text-align:center;
  font-size:16px;
  font-weight:900;
  color:#fff2c7;
  margin-bottom:8px;
}
.side-sub{
  display:block;
  font-size:10px;
  color:var(--muted);
}
.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.card-cell{
  height:54px;
  border-radius:14px;
  border:1px solid #5a4319;
  background:#151515;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:900;
  color:#fff7dd;
  cursor:pointer;
}
.card-cell.span2{grid-column:1 / span 2}
.card-cell.active{
  border-color:#f5d06f;
  background:#2b210d;
}
.card-cell.empty::after{
  font-size:12px;
  color:#8a7b57;
}
.p1.empty::after{content:"P1"}
.p2.empty::after{content:"P2"}
.p3.empty::after{content:"P3"}
.b1.empty::after{content:"B1"}
.b2.empty::after{content:"B2"}
.b3.empty::after{content:"B3"}

.main-panel,.predict,.keys-panel,.history-panel{
  background:#111;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
}

.info-row{
  display:grid;
  grid-template-columns:auto auto 1fr auto auto;
  gap:6px;
  align-items:center;
}
.badge{
  min-width:68px;
  padding:7px 10px;
  border-radius:999px;
  font-size:14px;
  font-weight:900;
  text-align:center;
  border:1px solid #4a3717;
  background:#131313;
}
.badge.player{color:var(--blue)}
.badge.banker{color:var(--red)}
.winner{
  font-size:18px;
  font-weight:900;
  text-align:center;
}
.winner.player{color:var(--blue)}
.winner.banker{color:var(--red)}
.winner.tie{color:var(--green)}

.btn{
  border:none;
  border-radius:12px;
  padding:8px 10px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  color:#111;
  background:linear-gradient(180deg,#f5d06f 0%, #c89b3c 100%);
}
.btn-clear{
  background:linear-gradient(180deg,#e7e5e4 0%, #a8a29e 100%);
}
.btn-history{
  background:linear-gradient(180deg,#fda4af 0%, #dc2626 100%);
  color:#fff;
}

.predict-line{
  font-size:30px;
  font-weight:900;
}
.predict-meta{
  margin-top:6px;
  font-size:15px;
  color:#d8c28a;
}

.h-label{color:var(--purple)}
.m-label{color:var(--red)}
.r-label{color:var(--orange)}

.stats{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#191919;
  border:1px solid #4a3717;
  border-radius:14px;
  padding:10px 6px;
  text-align:center;
}
.stat-name{
  font-size:14px;
  font-weight:900;
  color:var(--muted);
}
.stat-rate{
  margin-top:5px;
  font-size:20px;
  font-weight:900;
}
.stat.h .stat-rate{color:var(--purple)}
.stat.m .stat-rate{color:var(--red)}
.stat.r .stat-rate{color:var(--orange)}

.heat{
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}
.heat-box,.power-box{
  background:#1a1a1a;
  border:1px solid #4a3717;
  border-radius:14px;
  padding:10px 12px;
  font-size:15px;
  font-weight:900;
}
.power-strong{background:#ef4444;color:#111}
.power-mid{background:#fb923c;color:#111}
.power-low{background:#60a5fa;color:#111}
.power-wait{background:#9ca3af;color:#111}

.key-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.key{
  border:1px solid #45351a;
  background:#1f1f1f;
  border-radius:12px;
  min-height:44px;
  font-size:16px;
  font-weight:900;
  color:#f9e3a4;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.h-item{
  border:1px solid #4a3717;
  border-radius:12px;
  background:#1b1b1b;
  padding:8px;
}
.h-grid{
  display:grid;
  grid-template-columns:118px 1fr 82px;
  gap:8px;
}
.h-mtr{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.h-mtr>div{
  text-align:center;
  border-radius:10px;
  padding:9px 4px;
  color:#111;
  font-weight:900;
}
.hit{background:#16a34a}
.miss{background:#dc2626}
.draw{background:#64748b}
.h-result{
  font-size:13px;
  font-weight:900;
  text-align:center;
  border-radius:999px;
  padding:10px 6px;
  color:#111;
}

@media (max-width:700px)
  .stats{
  gap:3px !important;
  margin-top:5px !important;
}

.stat{
  padding:4px 2px !important;
  border-radius:8px !important;
}

.stat-name{
  font-size:9px !important;
  line-height:1 !important;
}

.stat-rate{
  font-size:13px !important;
  margin-top:2px !important;
  line-height:1 !important;
}

.predict-line{
  font-size:16px !important;
  line-height:1.05 !important;
}

.predict-meta{
  font-size:10px !important;
  margin-top:3px !important;
  line-height:1.15 !important;
}

.heat{
  gap:4px !important;
  margin-top:5px !important;
}

.heat-box,
.power-box{
  font-size:10px !important;
  padding:6px 7px !important;
  border-radius:9px !important;
}

.key{
  min-height:30px !important;
  font-size:11px !important;
  border-radius:8px !important;
}

.card-cell{
  height:42px !important;
  font-size:14px !important;
}

.badge{
  min-width:46px !important;
  font-size:10px !important;
  padding:4px 5px !important;
}

.winner{
  font-size:14px !important;
}

.btn{
  font-size:10px !important;
  padding:6px 6px !important;
  border-radius:8px !important;
}

.h-grid{
  grid-template-columns:70px 1fr 54px !important;
  gap:4px !important;
}

.h-mtr{
  gap:3px !important;
}

.h-mtr > div{
  font-size:9px !important;
  padding:5px 2px !important;
  border-radius:7px !important;
}

.h-result{
  font-size:9px !important;
  padding:6px 2px !important;
}
  {
.predict-line{font-size:18px}
.predict-meta{font-size:11px}
}
</style>
</head>
<body>
<div class="app">

<div class="logo">
<div class="logo-mark">H</div>
<div>
<div class="logo-title">HMR Card Counting</div>
<div class="logo-sub">HE × MATRIX × RUNNING VALUE</div>
</div>
</div>

<div class="top">
<div class="side">
<div class="side-title">PLAYER<span class="side-sub">閒家</span></div>
<div class="card-grid">
<div class="card-cell empty p1" data-index="0"></div>
<div class="card-cell empty p2" data-index="1"></div>
<div class="card-cell empty p3 span2" data-index="4"></div>
</div>
</div>

<div class="side">
<div class="side-title">BANKER<span class="side-sub">莊家</span></div>
<div class="card-grid">
<div class="card-cell empty b1" data-index="2"></div>
<div class="card-cell empty b2" data-index="3"></div>
<div class="card-cell empty b3 span2" data-index="5"></div>
</div>
</div>
</div>

<div class="main-panel">
<div class="info-row">
<div class="badge player" id="playerScore">閒 0</div>
<div class="badge banker" id="bankerScore">莊 0</div>
<div class="winner tie" id="winnerText">和局</div>
<button id="nextBtn" class="btn">下一局</button>
<button id="clearBoardBtn" class="btn btn-clear">清除本局</button>
</div>
<div id="detailText">請依序輸入牌面</div>
</div>

<div class="predict">
<div class="predict-line" id="linePredict">H:-　M:-　R:-</div>
<div class="predict-meta" id="linePredictMeta">H值:-｜M點差:-｜R尾數:-</div>

<div class="stats" id="lineStats">
<div class="stat h"><div class="stat-name">H勝率</div><div class="stat-rate">0%</div></div>
<div class="stat m"><div class="stat-name">M勝率</div><div class="stat-rate">0%</div></div>
<div class="stat r"><div class="stat-name">R勝率</div><div class="stat-rate">0%</div></div>
</div>

<div class="heat">
<div class="heat-box" id="heatBox">熱區判斷：目前尚無資料</div>
<div class="power-box power-wait" id="powerBox">下注：觀望</div>
</div>
</div>

<div class="keys-panel">
<div class="key-grid" id="cardButtons">
<button class="key" data-card="A">A</button>
<button class="key" data-card="2">2</button>
<button class="key" data-card="3">3</button>
<button class="key" data-card="4">4</button>
<button class="key" data-card="5">5</button>
<button class="key" data-card="6">6</button>
<button class="key" data-card="7">7</button>
<button class="key" data-card="8">8</button>
<button class="key" data-card="9">9</button>
<button class="key" data-card="10">10</button>
<button class="key" data-card="J">J</button>
<button class="key" data-card="Q">Q</button>
<button class="key" data-card="K">K</button>
<button class="key" id="skipBtn">不補</button>
</div>
</div>

<div class="history-panel">
<div style="display:flex;justify-content:space-between;margin-bottom:8px;">
<div>
<div style="font-size:16px;font-weight:900;">歷史紀錄</div>
<div style="font-size:12px;color:#bba676;">最近10筆｜H / M / R</div>
</div>
<button id="clearHistoryBtn" class="btn btn-history">清除歷史</button>
</div>
<div class="history-list" id="historyList"></div>
</div>
</div>

<script>
(function(){

let values=['','','','','',''];
let currentStep=0;
let historyData=[];
let pendingPrediction=null;

const cells=[...document.querySelectorAll('.card-cell')];

function getValue(card){
if(!card)return 0;
if(card==='A')return 1;
if(['10','J','Q','K'].includes(card))return 0;
return parseInt(card)||0;
}

function evaluateH(playerCards, bankerCards){
if(playerCards.length<2||bankerCards.length<2){
return {pick:'-',meta:'值:-'};
}

function diffTwo(a,b){
const x=getValue(a);
const y=getValue(b);
return Math.max(x,y)-Math.min(x,y);
}

const pBase=diffTwo(playerCards[0],playerCards[1]);
const bBase=diffTwo(bankerCards[0],bankerCards[1]);

let total=Math.max(pBase,bBase)-Math.min(pBase,bBase);

const totalCards=playerCards.length+bankerCards.length;

if(totalCards===4){
 total=total/2;
 total=total/2;
}else{
 const pThird=playerCards[2]?getValue(playerCards[2])/2:null;
 const bThird=bankerCards[2]?getValue(bankerCards[2])/2:null;

 if(pThird!==null&&bThird!==null){
   total=total-(Math.max(pThird,bThird)-Math.min(pThird,bThird));
 }else if(pThird!==null){
   total=total-pThird;
 }else if(bThird!==null){
   total=total-bThird;
 }
}

while(total>3){
 total=total/2;
}

let pick;

if(total<=2){
 pick='閒';
}else{
 pick='莊';
}

return {
 pick,
 meta:'值:'+total
};
}

function evaluateM(playerCards, bankerCards, allCards){
const p=playerCards.reduce((s,c)=>s+getValue(c),0);
const b=bankerCards.reduce((s,c)=>s+getValue(c),0);
const diff=p-b;
const publicCount=allCards.filter(c=>['10','J','Q','K'].includes(c)).length;
const sign1=diff>=0?'正':'負';
const sign2=publicCount%2===0?'正':'負';
const result=sign1===sign2?'正':'負';
return {
 pick:result==='正'?'閒':'莊',
 meta:'點差:'+diff+' 公牌:'+publicCount
};
}

function evaluateR(playerCards, bankerCards, allCards){
const p=playerCards.reduce((s,c)=>s+getValue(c),0)%10;
const b=bankerCards.reduce((s,c)=>s+getValue(c),0)%10;
const tail=p+b;
const publicCount=allCards.filter(c=>['10','J','Q','K'].includes(c)).length;
const flip=allCards.length>=5||(allCards.length===4&&publicCount===0);
let pick=tail<=9?'閒':'莊';
if(flip){
 pick=pick==='閒'?'莊':'閒';
}
return {
 pick,
 meta:'尾數:'+tail+' 翻邊:'+(flip?'是':'否')
};
}

function render(){

cells.forEach((cell)=>{
 const idx=parseInt(cell.dataset.index);
 const val=values[idx];
 cell.textContent=val;
 if(val)cell.classList.remove('empty');
 else cell.classList.add('empty');
});

const playerCards=[values[0],values[1],values[4]].filter(Boolean);
const bankerCards=[values[2],values[3],values[5]].filter(Boolean);
const allCards=[...playerCards,...bankerCards];

const h=evaluateH(playerCards,bankerCards);
const m=evaluateM(playerCards,bankerCards,allCards);
const r=evaluateR(playerCards,bankerCards,allCards);

function colorPick(type,pick){
const map={H:'h-label',M:'m-label',R:'r-label'};
return '<span class="'+map[type]+'">'+type+':'+pick+'</span>';
}

document.getElementById('linePredict').innerHTML=
colorPick('H',h.pick)+'　'+
colorPick('M',m.pick)+'　'+
colorPick('R',r.pick);

document.getElementById('linePredictMeta').textContent=
'H'+h.meta+' ｜ M'+m.meta+' ｜ R'+r.meta;
}

document.getElementById('cardButtons').addEventListener('click',function(e){
const btn=e.target.closest('[data-card]');
if(!btn)return;
if(currentStep>=6)return;
values[[0,1,2,3,4,5][currentStep]]=btn.dataset.card;
currentStep++;
render();
});

document.getElementById('skipBtn').addEventListener('click',function(){
currentStep++;
render();
});

document.getElementById('clearBoardBtn').addEventListener('click',function(){
values=['','','','','',''];
currentStep=0;
render();
});

render();
})();
</script>
</body>
</html>
